<desc style="fill:rgb(0, 0, 0);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">A line graph showing cost per token on the Y axis and context length from 0 to 1M tokens on the X axis. Cost is flat up to 200K tokens where the model is compute-bound. At 200K a crossover point is marked where KV cache fetch time overtakes compute time and cost begins rising linearly. A shaded region highlights the memory-bandwidth-bound zone.</desc>
